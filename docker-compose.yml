


services:

  api:

    build: .

    container_name: ai-assistant-api

    volumes:
       - .:/app
       - ./chroma:/app/chroma

    ports:
      - "8000:8000"

    env_file:
      - .env

    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload

    environment:
      WATCHFILES_FORCE_POLLING: "true"

    depends_on:
      redis:
         condition: service_healthy
      postgres:
         condition: service_healthy



  redis:

    image: redis:7

    container_name: ai-assistant-redis

    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli","ping"]
      interval: 10s
      timeout: 5s
      retries: 5
     



  postgres:

    image: postgres:16

    container_name: ai-assistant-postgres

    environment:

      POSTGRES_USER: alan

      POSTGRES_PASSWORD: 123456

      POSTGRES_DB: ai_assistant


    ports:

      - "5432:5432"


    volumes:

      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alan -d ai_assistant"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  frontend:
    build: .
    container_name: ai-assistant-frontend

    command: >
      streamlit run frontend/app.py
      --server.address 0.0.0.0
      --server.port 8501

    volumes:
      - .:/app

    ports:
      - "8501:8501"

    depends_on:
      - api



volumes:

  postgres_data:
  redis_data: