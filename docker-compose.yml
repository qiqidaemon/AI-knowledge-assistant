services:

  api:

    build: .

    container_name: ai-assistant-api

    volumes:
       - ./chroma:/app/chroma

    ports:
      - "8000:8000"

    env_file:
      - .env

    depends_on:
      redis:
         condition: service_healthy
      postgres:
         condition: service_healthy



  redis:

    image: redis:7

    container_name: ai-assistant-redis

    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli","ping"]
      interval: 10s
      timeout: 5s
      retries: 5
     



  postgres:

    image: postgres:16

    container_name: ai-assistant-postgres

    environment:

      POSTGRES_USER: alan

      POSTGRES_PASSWORD: 123456

      POSTGRES_DB: ai_assistant


    ports:

      - "5432:5432"


    volumes:

      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alan -d ai_assistant"]
      interval: 10s
      timeout: 5s
      retries: 5
      



volumes:

  postgres_data:
  redis_data: