services:

  api:

    build: .

    container_name: ai-assistant-api

    ports:
      - "8000:8000"

    env_file:
      - .env

    depends_on:
      - redis
      - postgres



  redis:

    image: redis:latest

    container_name: ai-assistant-redis

    ports:
      - "6379:6379"



  postgres:

    image: postgres:16

    container_name: ai-assistant-postgres

    environment:

      POSTGRES_USER: alan

      POSTGRES_PASSWORD: 123456

      POSTGRES_DB: ai_assistant


    ports:

      - "5432:5432"


    volumes:

      - postgres_data:/var/lib/postgresql/data



volumes:

  postgres_data: